# Cloud Spider config. Copy to cloudspider.yaml (gitignored) and edit, or
# point $CLOUDSPIDER_CONFIG at a file anywhere. Also read when nothing else
# is: ~/.config/cloudspider/config.yaml.
#
# Every key is optional; the value shown is the default.
# Precedence, lowest to highest: defaults < this file < env vars < flags.
#   npm start -- --port 9300 --theme pro --set cost.enabled=false
#   npm start -- --help        (every key, its env var and its flag)
# The effective config (with where each value came from) is at
# http://127.0.0.1:9241/api/config. A bad key or value stops the start with
# file:line and what is wrong.

server:
  host: 127.0.0.1          # env CLOUDSPIDER_HOST, --host. Keep loopback: there is no login.
  port: 9241               # env PORT, --port

aws:
  profile: ""              # env AWS_PROFILE, --profile. Empty: the SDK default chain.
  region: ""               # env AWS_REGION, --region. The region the map opens on.
  regions: []              # only these in the region picker, e.g. [eu-north-1, eu-west-1]
  logGroup: ""             # env CLOUDSPIDER_LOG_GROUP, e.g. /cloudspider/test

kube:
  context: cloudspider-viewer          # env CLOUDSPIDER_KUBE_CONTEXT: used when no contexts are listed
  contextsFile: cloudspider.contexts.yaml  # env CLOUDSPIDER_KUBE_CONTEXTS_FILE: the file CONNECT writes
  autoConnect: true                    # env CLOUDSPIDER_KUBE_AUTO_CONNECT: CONNECT after an EKS RUN on Stacks, DISCONNECT after TAKE IT DOWN
  # Contexts and namespace allowlists. Listed here first; entries of the
  # contexts file are added after them (a name in both keeps this entry).
  # env CLOUDSPIDER_KUBE_CONTEXTS="ctxA:ns1,ns2;ctxB:*" replaces both.
  contexts: []
  # contexts:
  #   - context: cloudspider-viewer
  #     label: DEMO
  #     namespaces: "*"            # every namespace (needs cluster-wide list rights)
  #   - context: my-work-context
  #     label: WORK
  #     namespaces: [team-a, team-b]
  #     poll: 60                   # seconds between health reads (>= 30)

ui:
  theme: pip               # pip | pro. env CLOUDSPIDER_THEME, --theme. The settings panel overrides it per browser.
  defaultView: map         # map | path | cluster | vaults. env CLOUDSPIDER_VIEW, --view
  refresh:
    mapSeconds: 1          # instance state poll
    radioSeconds: 30       # CloudTrail read
    kubeSeconds: 15        # pod health watch tick (each context keeps its own poll)
    sloSeconds: 30         # background SLO evaluation

paths:
  vaults: vaults           # env CLOUDSPIDER_VAULTS_DIR. Vault files (and their SLOs).

cost:
  enabled: true            # env CLOUDSPIDER_COST=0 turns CAPS' Cost Explorer reads off
  cacheTtlMinutes: 360     # env CLOUDSPIDER_COST_TTL_MINUTES. At least 60: each read is ~5 billed calls ($0.05).

logs:
  # LOG ERRORS in the morning report: last night's errors grouped by service.
  window: "22:00-07:00"    # env CLOUDSPIDER_LOGS_WINDOW. Local time; compared with the same window yesterday.
  loki:
    url: ""                # env CLOUDSPIDER_LOKI_URL, e.g. http://127.0.0.1:3100 (a port-forward). Empty: the observe bundle's Loki when found.
    tenant: ""             # X-Scope-OrgID for a multi-tenant Loki
  cloudwatch:
    logGroup: ""           # env CLOUDSPIDER_LOGS_GROUP, e.g. /aws/containerinsights/<cluster>/application (Container Insights)

storage:
  backend: file            # file. dynamodb is designed, not built (docs/storage.md).
  path: .cloudspider       # env CLOUDSPIDER_STATE_DIR. Bill cache, SLO history, run logs.
  table: ""                # reserved for the dynamodb backend

learn:
  # The lab cluster LEARN checks run against; every kubectl/oc they call is
  # pinned to it. Must look like a lab (kind-*, k3d-*, minikube,
  # docker-desktop, rancher-desktop, crc, or "lab" in the name); ppf-* work
  # contexts are always refused. Empty: RUN CHECK says "no lab context".
  context: ""              # env CLOUDSPIDER_LAB_CONTEXT, e.g. kind-lab
  deny: []                 # env CLOUDSPIDER_LAB_DENY=a,b. More contexts that are never a lab.

scorecard:
  # SCORE: which profile judges the scan (production rules when empty, and
  # the report says it assumed that), which regions the AWS scan reads
  # (first is home; empty: aws.region) and which packs SCAN offers.
  environment: ""          # production, staging, development, sandbox…
  regions: []              # e.g. [eu-north-1, eu-west-1]
  packs: [kubernetes, aws]

network:
  # Network debugging: the DEBUG bar in PATH. Probes only the URL you type
  # (GET/HEAD, no body, no cookies), rate-limited; metadata and link-local
  # addresses are always refused, private ones unless allowed.
  enabled: true            # env CLOUDSPIDER_FEATURE_NETWORK
  local:
    timeoutSeconds: 10     # per step
    maxRedirects: 10       # followed only to port 80, 443 or the URL's own port
    doh: [https://cloudflare-dns.com/dns-query, https://dns.google/resolve]   # [] turns the public DNS comparison off
    ipv6: auto             # auto | off
    allowInternalTargets: false   # env CLOUDSPIDER_NETWORK_INTERNAL. Loopback / RFC 1918 targets (VPN users)
    rateLimit:
      perHostPerMinute: 6
      perMinute: 30
      concurrent: 2
  aws:                     # read-only: List/Get/Describe and TestDNSAnswer
    route53: true          # zones, records, TestDNSAnswer, health checks, dangling records
    cloudfront: true       # distributions: behaviour, origin, viewer policy, TLS, WAF
    vpc: true              # NACLs, VPC endpoints, subnet free IPs, flow log settings
    flowLogs: true         # REJECTs to the targets in the flow log group (15 min, bounded)
  reports:
    keep: 50               # reports kept under storage.path/netdebug

stacks:
  eks:
    maxNodes: 3            # most nodes the EKS card's nodeCount takes (1-10; each node is billed).

# Modules: which surfaces are on. k8s-only never creates an AWS client.
# Settings › Modules shows the result and the lines to paste here.
modules:
  profile: full            # env CLOUDSPIDER_PROFILE, flag --modules. full, k8s-only or aws-only.
  enable: []               # add modules (their needs come too), e.g. [observe].
  disable: []              # take modules out (dependents go too), e.g. [cost, radio].

features:
  ask: true                # env CLOUDSPIDER_FEATURE_ASK. ASK, the local agent terminal.
  stacksRun: true          # env CLOUDSPIDER_FEATURE_STACKS_RUN. Running Pulumi from STACKS.
  learn: true              # env CLOUDSPIDER_FEATURE_LEARN. LEARN labs.
  scorecard: true          # SCORE. Its FIX button also needs stacksRun.

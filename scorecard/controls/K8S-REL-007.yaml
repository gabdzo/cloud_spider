kind: Control
id: K8S-REL-007
revision: 2
title: "Persistent volumes are backed up"
category: reliability
target: kubernetes
evidenceType: config
severity: { default: high }
confidence: high
evaluator: pv-backup-coverage
aggregation: proportional
requires: [kube-pvcs, kube-pvs, kube-cnpg, kube-velero, aws-backup-protected]
whyItMatters: "A deleted or corrupted volume without a backup is data loss."
remediation: { summary: "Cover every bound PVC: CNPG volumes by the cluster's own backups (Barman Cloud plugin; Postgres on EKS card: backups on), others by a Velero schedule for the namespace or an AWS Backup plan that selects the EBS volume (e.g. by tag). Then test a restore.", effort: M, cardFor: { "shop/": pgcluster } }
verification: "Each bound PVC belongs to a CNPG cluster with backups, a namespace a Velero schedule includes, or an EBS volume AWS Backup lists as protected."
references:
  - { source: "Velero schedules", url: "https://velero.io/docs/main/backup-reference/" }
  - { source: "AWS Backup for EBS", url: "https://docs.aws.amazon.com/aws-backup/latest/devguide/whatisbackup.html" }

kind: Control
id: K8S-REL-004
revision: 1
title: "Ready nodes span at least two zones"
category: reliability
target: kubernetes
evidenceType: config
severity: { default: high }
confidence: high
evaluator: nodes-multi-zone
aggregation: all-or-nothing
requires: [kube-cluster, kube-nodes]
whyItMatters: "All nodes in one zone means one zone outage is a full outage."
remediation: { summary: "Set NODE COUNT to 2 or more on the Stacks EKS card (the node group spans eu-north-1a and 1b; its Auto Scaling group balances zones). With Karpenter, give replicated workloads a topologySpreadConstraint on topology.kubernetes.io/zone so it launches in both.", effort: S, addon: karpenter }
verification: "Ready nodes carry at least two distinct topology.kubernetes.io/zone labels."

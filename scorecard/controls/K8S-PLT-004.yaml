kind: Control
id: K8S-PLT-004
revision: 2
title: "cert-manager runs"
category: platform
target: kubernetes
evidenceType: config
severity: { default: low }
confidence: high
evaluator: workload-present
aggregation: all-or-nothing
requires: [kube-cluster, kube-deployments, kube-daemonsets, kube-ingresses]
params:
  skipIfAllAcm: true

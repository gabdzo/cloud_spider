apiVersion: apps/v1
kind: Deployment
metadata: {name: good, namespace: shop}
spec:
  selector: {matchLabels: {a: b}}
  template:
    metadata: {labels: {a: b, app.kubernetes.io/name: good}}
    spec:
      containers:
      - name: c
        image: repo/x:1.2
        resources: {requests: {cpu: 10m, memory: 10Mi}}
        readinessProbe: {httpGet: {path: /, port: 80}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: bad, namespace: shop}
spec:
  selector: {matchLabels: {a: b}}
  template:
    metadata: {labels: {a: b}}
    spec:
      volumes: [{name: h, hostPath: {path: /}}]
      initContainers: [{name: i, image: "busybox:latest", securityContext: {privileged: true}}]
      containers:
      - name: c
        image: nginx
---
apiVersion: v1
kind: Pod
metadata: {name: sys, namespace: kube-system}
spec:
  containers: [{name: c, image: nginx}]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: otel-collector, namespace: demo}
spec:
  selector: {matchLabels: {app: otel-collector}}
  template:
    metadata: {labels: {app: otel-collector, app.kubernetes.io/name: otel}}
    spec:
      volumes: [{name: h, hostPath: {path: /var/log/pods}}]
      containers: [{name: c, image: "otel:1", resources: {requests: {cpu: 1m, memory: 1Mi}}, readinessProbe: {httpGet: {path: /, port: 1}}}]
---
apiVersion: v1
kind: Pod
metadata:
  name: otel-collector-abcde
  namespace: demo
  labels: {app: otel-collector, app.kubernetes.io/name: otel}
  ownerReferences: [{apiVersion: apps/v1, kind: DaemonSet, name: otel-collector, uid: x, controller: true}]
spec:
  volumes: [{name: h, hostPath: {path: /var/log/pods}}]
  containers: [{name: c, image: "otel:1", resources: {requests: {cpu: 1m, memory: 1Mi}}, readinessProbe: {httpGet: {path: /, port: 1}}}]
---
apiVersion: v1
kind: Pod
metadata: {name: sneaky, namespace: demo, labels: {app: otel-collector, app.kubernetes.io/name: x}}
spec:
  volumes: [{name: h, hostPath: {path: /}}]
  containers: [{name: c, image: "otel:1", resources: {requests: {cpu: 1m, memory: 1Mi}}, readinessProbe: {httpGet: {path: /, port: 1}}}]

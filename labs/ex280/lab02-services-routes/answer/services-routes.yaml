apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ex280-lab02
spec:
  selector:
    app: web
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ex280-lab02
spec:
  selector:
    app: api
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: shop-web
  namespace: ex280-lab02
spec:
  host: shop-lab02.APPS_DOMAIN
  path: /
  to:
    kind: Service
    name: web
  port:
    targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: shop-api
  namespace: ex280-lab02
spec:
  host: shop-lab02.APPS_DOMAIN
  path: /api
  to:
    kind: Service
    name: api
  port:
    targetPort: http

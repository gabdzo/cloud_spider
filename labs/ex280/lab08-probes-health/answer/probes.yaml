apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ex280-lab08
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: app
        image: registry.access.redhat.com/ubi9/httpd-24:latest
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: html
          mountPath: /var/www/html/index.html
          subPath: index.html
      volumes:
      - name: html
        configMap:
          name: web-html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-html
  namespace: ex280-lab08
data:
  index.html: |
    WORKER-OK
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ex280-lab08
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: app
        image: registry.access.redhat.com/ubi9/httpd-24:latest
        ports:
        - name: http
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: html
          mountPath: /var/www/html/index.html
          subPath: index.html
      volumes:
      - name: html
        configMap:
          name: worker-html

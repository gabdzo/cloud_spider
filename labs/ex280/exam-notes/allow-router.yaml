apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-router
  namespace: ex280-app
spec:
  podSelector:
    matchLabels:
      app: ex280-app-be
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            kubernetes.io/metadata.name: openshift-ingress
      ports:
        - protocol: TCP
          port: 8080

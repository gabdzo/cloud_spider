apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-editor-limited
  namespace: ex280-app

rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

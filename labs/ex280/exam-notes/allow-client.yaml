apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-client
  namespace: ex280-app
spec:
  podSelector:
    matchLabels:
      app: ex280-app-be
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ex280-client
          podSelector:
            matchLabels:
              access: backend
      ports:
        - protocol: TCP
          port: 8080

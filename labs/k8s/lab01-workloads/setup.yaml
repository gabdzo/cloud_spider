# Starting state for lab01-workloads (deliberately broken). Apply with:
#   kubectl apply -f labs/k8s/lab01-workloads/setup.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-lab01
  labels:
    cloudspider.lab: k8s
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-page
  namespace: k8s-lab01
data:
  index.html: |
    <h1>CATALOG-OK</h1>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-page
  namespace: k8s-lab01
data:
  index.html: |
    <h1>INVENTORY-OK</h1>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: k8s-lab01
  labels:
    app: catalog
spec:
  replicas: 3
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine-typo
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: page
          configMap:
            name: catalog-page
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: k8s-lab01
spec:
  selector:
    app: catalog
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: k8s-lab01
  labels:
    app: inventory
spec:
  replicas: 0
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:latest
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
      volumes:
        - name: page
          configMap:
            name: inventory-page
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: k8s-lab01
spec:
  selector:
    app: inventory
  ports:
    - name: http
      port: 8080
      targetPort: 8080

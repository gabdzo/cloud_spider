# Kubernetes (EKS) variant of labs/ex280/lab09-jobs-cronjobs (OpenShift EX280).
# The Learn view reads this file. check.sh only reads the cluster.
id: lab09-jobs-cronjobs
title: Jobs and CronJobs
track: k8s
openshift: labs/ex280/lab09-jobs-cronjobs
task: "`k8s-lab09` has a Job that never finishes and a CronJob that never runs."
requirements:
  - "Job `batch`: completions 3, parallelism 2, succeeded"
  - "CronJob `tick`: schedule `*/1 * * * *`, not suspended, successfulJobsHistoryLimit 3, failedJobsHistoryLimit 1"
  - At least one Job created by `tick` succeeded
setup:
  - kubectl apply -f labs/k8s/lab09-jobs-cronjobs/setup.yaml
hints:
  - "A Job's pod template cannot be changed: delete and re-create it."
  - "`kubectl logs job/batch` shows why it fails."
  - "`kubectl create job --from=cronjob/tick` runs it once now."
check: labs/k8s/lab09-jobs-cronjobs/check.sh
reset:
  - kubectl delete namespace k8s-lab09 --ignore-not-found --wait=true
  - kubectl apply -f labs/k8s/lab09-jobs-cronjobs/setup.yaml
cleanup:
  - kubectl delete namespace k8s-lab09 --ignore-not-found
needs:
  - kubectl
  - python3
mapping:
  - openshift: same objects
    kubernetes: Job and CronJob are core Kubernetes
noEquivalent: []
docs:
  - https://kubernetes.io/docs/concepts/workloads/controllers/job/
  - https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/

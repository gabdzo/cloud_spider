# Starting state for lab09-jobs-cronjobs (deliberately broken). Apply with:
#   kubectl apply -f labs/k8s/lab09-jobs-cronjobs/setup.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-lab09
  labels:
    cloudspider.lab: k8s
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: batch/v1
kind: Job
metadata:
  name: batch
  namespace: k8s-lab09
spec:
  completions: 3
  parallelism: 2
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: work
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsUser: 1000
          command:
            - sh
            - -c
            - echo working; exit 3
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tick
  namespace: k8s-lab09
spec:
  schedule: 0 0 31 2 *
  suspend: true
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: work
              image: busybox:1.36
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsUser: 1000
              command:
                - sh
                - -c
                - date

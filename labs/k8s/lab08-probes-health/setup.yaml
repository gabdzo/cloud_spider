# Starting state for lab08-probes-health (deliberately broken). Apply with:
#   kubectl apply -f labs/k8s/lab08-probes-health/setup.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-lab08
  labels:
    cloudspider.lab: k8s
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-page
  namespace: k8s-lab08
data:
  index.html: |
    <h1>WEB-OK</h1>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: k8s-lab08
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
      volumes:
        - name: page
          configMap:
            name: web-page
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: k8s-lab08
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-page
  namespace: k8s-lab08
data:
  index.html: |
    <h1>WORKER</h1>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: k8s-lab08
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            tcpSocket:
              port: 9999
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
      volumes:
        - name: page
          configMap:
            name: worker-page

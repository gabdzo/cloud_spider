# Starting state for lab02-services-routes (deliberately broken). Apply with:
#   kubectl apply -f labs/k8s/lab02-services-routes/setup.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-lab02
  labels:
    cloudspider.lab: k8s
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-page
  namespace: k8s-lab02
data:
  index.html: |
    <h1>WEB-OK</h1>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-page
  namespace: k8s-lab02
data:
  index.html: |
    <h1>API-OK</h1>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: k8s-lab02
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: page
          configMap:
            name: web-page
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: k8s-lab02
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: page
          configMap:
            name: api-page
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: k8s-lab02
spec:
  selector:
    app: webb
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: k8s-lab02
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: k8s-lab02
spec:
  rules:
    - host: shop-lab02.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8081

apiVersion: v1
kind: Namespace
metadata:
  name: k8s-lab14-inv
  labels:
    cloudspider.lab: k8s
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: q
  namespace: k8s-lab14-inv
spec:
  hard:
    requests.memory: 100Mi
    pods: "4"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-page
  namespace: k8s-lab14-inv
data:
  index.html: |
    <h1>INV-OK</h1>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: k8s-lab14-inv
  labels:
    app: inventory
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: page
          configMap:
            name: inventory-page
---
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-lab14-audit
  labels:
    cloudspider.lab: k8s
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-page
  namespace: k8s-lab14-audit
data:
  index.html: |
    <h1>AUDIT</h1>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit
  namespace: k8s-lab14-audit
  labels:
    app: audit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit
  template:
    metadata:
      labels:
        app: audit
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /
              port: 8081
            periodSeconds: 5
      volumes:
        - name: page
          configMap:
            name: audit-page

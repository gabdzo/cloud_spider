# Starting state for lab14-troubleshooting (deliberately broken). Apply with:
#   kubectl apply -f labs/k8s/lab14-troubleshooting/setup.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-lab14-store
  labels:
    cloudspider.lab: k8s
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-page
  namespace: k8s-lab14-store
data:
  index.html: |
    <h1>STORE-OK</h1>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: k8s-lab14-store
  labels:
    app: storefront
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivilegd:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: page
          configMap:
            name: storefront-page
---

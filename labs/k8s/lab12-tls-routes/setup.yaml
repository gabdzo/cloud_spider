# Starting state for lab12-tls-routes (deliberately broken). Apply with:
#   kubectl apply -f labs/k8s/lab12-tls-routes/setup.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-lab12
  labels:
    cloudspider.lab: k8s
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-page
  namespace: k8s-lab12
data:
  index.html: |
    <h1>OK</h1>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: k8s-lab12
  labels:
    app: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge
  template:
    metadata:
      labels:
        app: edge
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: page
          configMap:
            name: app-page
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passthrough
  namespace: k8s-lab12
  labels:
    app: passthrough
spec:
  replicas: 1
  selector:
    matchLabels:
      app: passthrough
  template:
    metadata:
      labels:
        app: passthrough
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: page
          configMap:
            name: app-page
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reencrypt
  namespace: k8s-lab12
  labels:
    app: reencrypt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reencrypt
  template:
    metadata:
      labels:
        app: reencrypt
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: page
          configMap:
            name: app-page
---
apiVersion: v1
kind: Service
metadata:
  name: edge
  namespace: k8s-lab12
spec:
  selector:
    app: edge
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: passthrough
  namespace: k8s-lab12
spec:
  selector:
    app: passthrough
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: reencrypt
  namespace: k8s-lab12
spec:
  selector:
    app: reencrypt
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edge
  namespace: k8s-lab12
  annotations: {}
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - edge-lab12.example.test
      secretName: missing-edge-tls
  rules:
    - host: edge-lab12.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edge
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: passthrough
  namespace: k8s-lab12
  annotations: {}
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - passthrough-lab12.example.test
      secretName: missing-pass-tls
  rules:
    - host: passthrough-lab12.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: passthrough
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reencrypt
  namespace: k8s-lab12
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - reencrypt-lab12.example.test
      secretName: missing-re-tls
  rules:
    - host: reencrypt-lab12.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reencrypt
                port:
                  number: 8080

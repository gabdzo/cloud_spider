# Kubernetes (EKS) variant of labs/ex280/lab12-tls-routes (OpenShift EX280).
# The Learn view reads this file. check.sh only reads the cluster.
id: lab12-tls-routes
title: TLS on Ingress
track: k8s
openshift: labs/ex280/lab12-tls-routes
task: "`k8s-lab12` publishes `edge`, `passthrough` and `reencrypt` hosts under `*.example.test` through ingress-nginx. TLS is wrong on all three. Make a certificate per host (openssl or cert-manager) and wire it in."
requirements:
  - "`edge`: Ingress TLS terminates at the controller with a Secret whose certificate is valid for `edge-lab12.example.test`"
  - '`passthrough`: annotation `nginx.ingress.kubernetes.io/ssl-passthrough: "true"` and the backend serves TLS itself'
  - "`reencrypt`: TLS at the controller and `nginx.ingress.kubernetes.io/backend-protocol: HTTPS` to the backend"
setup:
  - kubectl apply -f labs/k8s/lab12-tls-routes/setup.yaml
hints:
  - "`openssl req -x509 -newkey rsa:2048 -nodes -subj /CN=edge-lab12.example.test -addext subjectAltName=DNS:edge-lab12.example.test ...`"
  - "`kubectl create secret tls edge-tls --cert --key -n k8s-lab12`"
  - Passthrough needs the controller started with `--enable-ssl-passthrough`.
check: labs/k8s/lab12-tls-routes/check.sh
reset:
  - kubectl delete namespace k8s-lab12 --ignore-not-found --wait=true
  - kubectl apply -f labs/k8s/lab12-tls-routes/setup.yaml
cleanup:
  - kubectl delete namespace k8s-lab12 --ignore-not-found
needs:
  - kubectl
  - python3
mapping:
  - openshift: "Route termination: edge"
    kubernetes: Ingress `tls:` + Secret
  - openshift: "Route termination: passthrough"
    kubernetes: ingress-nginx `ssl-passthrough` annotation (no core equivalent)
  - openshift: "Route termination: reencrypt"
    kubernetes: "ingress-nginx `backend-protocol: HTTPS` (no core equivalent)"
noEquivalent:
  - Passthrough and re-encrypt are ingress-nginx features, not core Ingress. The check reads the Ingress objects and certificates; it does not open TLS connections (no controller on the EKS stack).
docs:
  - https://kubernetes.io/docs/concepts/services-networking/ingress/#tls
  - https://kubernetes.github.io/ingress-nginx/user-guide/tls/

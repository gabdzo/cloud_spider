# The Pulumi state bucket every stack above uses
# (s3://cloudspider-state-550536272523). Made by infra/bootstrap.sh with the
# AWS CLI, not by Pulumi: a stack cannot create the bucket that holds its own
# state. Tag it once by hand (see README, "Vaults for this repo").
apiVersion: cloudspider/v1
kind: Vault
metadata:
  name: pulumi-state
  number: 150
  title: Pulumi state
  description: The versioned, private S3 bucket that holds the state of every Cloud Spider stack. Made by infra/bootstrap.sh.
  owner: gabriel
  tags: [state, s3]
spec:
  type: data
  resources:
    tags:
      project: pulumi-state
    ids:
      - cloudspider-state-550536272523
  links:
    repo: https://github.com/gabdzo/cloud_spider/blob/main/infra/bootstrap.sh
    docs: https://github.com/gabdzo/cloud_spider#readme
    dashboard: https://eu-north-1.console.aws.amazon.com/s3/buckets/cloudspider-state-550536272523?region=eu-north-1

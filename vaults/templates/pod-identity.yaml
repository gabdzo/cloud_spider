# Template (the pod-identity add-on is not up). One stack per cluster:
#   cd upgrades/addons && pulumi stack select --create pod-identity-cloudspider-up
# When it is up: npm run vaults:new -- pod-identity pod-identity
# upgrades/addons (Pulumi project cloudspider-addons, stack pod-identity-<cluster>):
# the eks-pod-identity-agent EKS add-on. AWS resources carry project=pod-identity and cluster=<cluster>;
# the pods are in the Cluster view, namespace kube-system.
apiVersion: cloudspider/v1
kind: Vault
metadata:
  name: pod-identity
  number: 200
  title: Pod Identity agent
  description: "The EKS Pod Identity agent: how Karpenter, the Load Balancer Controller and KEDA get AWS credentials without keys."
  owner: gabriel
  tags: [upgrade, eks, addon]
spec:
  type: cluster
  resources:
    tags:
      project: pod-identity
  stack:
    dir: upgrades/addons
    name: pod-identity-cloudspider-up
  links:
    repo: https://github.com/gabdzo/cloud_spider/tree/main/upgrades/addons
    docs: https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
    dashboard: https://eu-north-1.console.aws.amazon.com/eks/home?region=eu-north-1#/clusters/cloudspider-up

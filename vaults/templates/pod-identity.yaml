# Template. The eks-pod-identity-agent EKS add-on belongs to the EKS stack
# (upgrades/eks, docs/design/stack-dependencies.md; the old
# pod-identity-<cluster> add-on stack is empty since the hand-over), so this
# vault follows that one resource of the EKS stack: it is listed (AUTO) when
# an EKS stack has the add-on. The pods are in the Cluster view, kube-system.
apiVersion: cloudspider/v1
kind: Vault
metadata:
  name: pod-identity
  number: 200
  title: Pod Identity agent
  description: "The EKS Pod Identity agent: how Karpenter, the Load Balancer Controller and KEDA get AWS credentials without keys."
  owner: gabriel
  tags: [upgrade, eks, addon]
spec:
  type: cluster
  resources:
    tags:
      project: pod-identity
  stack:
    dir: upgrades/eks
    name: "*"
    resource: eks-pod-identity-agent
  links:
    repo: https://github.com/gabdzo/cloud_spider/tree/main/upgrades/addons
    docs: https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
    dashboard: https://eu-north-1.console.aws.amazon.com/eks/home?region=eu-north-1#/clusters/cloudspider-up

# Listed in VAULTS automatically while the shopapi stack is up (auto
# discovery, src/vault-view.js). To customise it, copy it into vaults/:
#   npm run vaults:new -- shopapi shopapi
# upgrades/shopapi (Pulumi project cloudspider-shopapi, stack shopapi): in
# namespace shop, a migration Job (psql) and PostgREST serving GET /items
# from shopdb. With expose=none it makes no AWS resources, so the vault binds
# it through its stack (spec.stack); with expose=alb the controller's ALB
# carries project=shopapi and lands here too. The pods show in the Cluster view.
apiVersion: cloudspider/v1
kind: Vault
metadata:
  name: shopapi
  number: 165
  title: Shop API
  description: A sample backend on EKS, PostgREST over the shopdb database, with a migration Job that creates and seeds the schema.
  owner: gabriel
  tags: [upgrade, eks, api]
spec:
  type: api
  resources:
    tags:
      project: shopapi
  stack:
    dir: upgrades/shopapi
    name: shopapi
  links:
    # expose=alb: the stack output url (http://<alb>/items); OPEN ↗ + lamp.
    view: {output: url}
    repo: https://github.com/gabdzo/cloud_spider/tree/main/upgrades/shopapi
    docs: https://docs.postgrest.org/
  # expose=alb only (no url output with expose=none: the check waits).
  checks:
    http:
      - url: {output: url}
        name: items
        expect: 200
        contains: price_cents
  # SLOs (docs/RUN-ME.md §17): measured from reads Cloud Spider already makes.
  # The ALB ones read its CloudWatch metrics once expose=alb made it.
  slos:
    - name: api-availability
      sli: availability
      source: alb
      target: 99.5%
      window: 30d
    - name: api-latency-p95
      sli: latency
      source: alb
      threshold: 500
      target: 99%
      window: 30d
    - name: items-check
      sli: availability
      source: check:items
      target: 99%
      window: 7d
    - name: api-restarts
      sli: error-rate
      source: kube:restarts:shop/shopapi
      target: 99%
      window: 30d

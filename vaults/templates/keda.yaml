# Template (the keda add-on is not up). One stack per cluster:
#   cd upgrades/addons && pulumi stack select --create keda-cloudspider-up
# When it is up: npm run vaults:new -- keda keda
# upgrades/addons (Pulumi project cloudspider-addons, stack keda-<cluster>):
# the jobs queue and the operator and worker roles. AWS resources carry project=keda and cluster=<cluster>;
# the pods are in the Cluster view, namespace keda.
apiVersion: cloudspider/v1
kind: Vault
metadata:
  name: keda
  number: 207
  title: KEDA
  description: "Optional."
  owner: gabriel
  tags: [upgrade, eks, addon]
spec:
  type: worker
  resources:
    tags:
      project: keda
  stack:
    dir: upgrades/addons
    name: keda-cloudspider-up
  links:
    repo: https://github.com/gabdzo/cloud_spider/tree/main/upgrades/addons
    docs: https://keda.sh/docs/
    dashboard: https://eu-north-1.console.aws.amazon.com/eks/home?region=eu-north-1#/clusters/cloudspider-up

# Template (the scaling-demo add-on is not up). One stack per cluster:
#   cd upgrades/addons && pulumi stack select --create scaling-demo-cloudspider-up
# When it is up: npm run vaults:new -- scaling-demo scaling-demo
# upgrades/addons (Pulumi project cloudspider-addons, stack scaling-demo-<cluster>):
# no AWS resources (two HPAs, the burst and inflate Deployments). AWS resources carry project=scaling-demo and cluster=<cluster>;
# the pods are in the Cluster view, namespace scaling-demo.
apiVersion: cloudspider/v1
kind: Vault
metadata:
  name: scaling-demo
  number: 204
  title: HPA scaling demo
  description: "HorizontalPodAutoscalers on the demo app's web and api (1 to 4 replicas at 60% CPU), a burst load generator, and an 'inflate' Deployment of pause pods (500m CPU each) that Karpenter has to find room for."
  owner: gabriel
  tags: [upgrade, eks, addon]
spec:
  type: cluster
  resources:
    tags:
      project: scaling-demo
  stack:
    dir: upgrades/addons
    name: scaling-demo-cloudspider-up
  links:
    repo: https://github.com/gabdzo/cloud_spider/tree/main/upgrades/addons
    docs: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
    dashboard: https://eu-north-1.console.aws.amazon.com/eks/home?region=eu-north-1#/clusters/cloudspider-up

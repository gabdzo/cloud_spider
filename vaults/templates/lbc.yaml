# Template (the lbc add-on is not up). One stack per cluster:
#   cd upgrades/addons && pulumi stack select --create lbc-cloudspider-up
# When it is up: npm run vaults:new -- lbc lbc
# upgrades/addons (Pulumi project cloudspider-addons, stack lbc-<cluster>):
# the controller role and policy (they carry project=lbc and cluster=<cluster>).
# The ALBs/NLBs it makes are the apps', not this vault's: they carry
# cluster, managed-by and cloudspider only (defaultTags, no project), so an
# Ingress's `alb.ingress.kubernetes.io/tags: project=<app>` reaches the
# ALB, and the app's vault owns it. Without that annotation, select the
# controller's own tag instead:  resources: { tags: { ingress.k8s.aws/stack: <ns>/<ingress> } }
# the pods are in the Cluster view, namespace kube-system.
apiVersion: cloudspider/v1
kind: Vault
metadata:
  name: lbc
  number: 205
  title: AWS Load Balancer Controller
  description: "Makes ALBs for Ingress and NLBs for Services of type LoadBalancer (with the annotation; it does not take over plain LoadBalancer Services)."
  owner: gabriel
  tags: [upgrade, eks, addon]
spec:
  type: service
  resources:
    tags:
      project: lbc
  stack:
    dir: upgrades/addons
    name: lbc-cloudspider-up
  links:
    repo: https://github.com/gabdzo/cloud_spider/tree/main/upgrades/addons
    docs: https://kubernetes-sigs.github.io/aws-load-balancer-controller/
    dashboard: https://eu-north-1.console.aws.amazon.com/eks/home?region=eu-north-1#/clusters/cloudspider-up

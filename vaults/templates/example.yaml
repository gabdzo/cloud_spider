# Template: everything in vaults/templates/ is a template. It is never drawn
# on the map, it is listed under TEMPLATES, and `npm run vaults:check` still
# validates it. Make a living vault from it with:
#   npm run vaults:new -- example <name>
# which writes vaults/<name>.yaml with the name, a free number and the
# project tag filled in.
#
# One vault per project. The map shows it as a door in the hillside; click it
# to see the project's resources, these links and its check results.
apiVersion: cloudspider/v1          # required, exactly this
kind: Vault                         # required, exactly this
metadata:
  name: example-site                # required: lowercase letters, digits, dashes (max 63), unique.
                                    # Convention: the same as the project tag below.
  number: 199                       # required: 0-999, the plate reads "VAULT 199". Keep them unique.
  title: Example site               # optional: display name (defaults to name)
  description: >-                   # required: one or two sentences, under 280 characters
    A short sentence about what this project is and why it exists.
  owner: gabriel                    # required: a person or team
  tags: [example, web]              # optional: words, shown in the panel
spec:
  type: static-site                 # required: static-site | service | api | cluster | worker | data | other
  resources:                        # what belongs to this vault; a resource matches if
                                    # ALL the tags match, OR any id matches
    tags:
      project: example-site         # the convention: project=<vault name> on every resource
    ids:                            # optional: instance ids, ARNs, or names
      - i-0123456789abcdef0         #   an EC2 instance id
      - arn:aws:s3:::example-site-bucket   # an ARN (an ARN ending in a known id matches too)
      - example-site-alb            #   a name (load balancer, cluster, function, table...)
  stack:                            # optional: the Pulumi stack this vault is (LIVE badge)
    dir: upgrades/example           #   the folder with Pulumi.yaml, relative to the repo
    name: example                   #   the stack name; a trailing * matches several (eks-*)
  links:                            # all optional, http(s) only
    view: https://example.com/      # the live thing (VIEW button)
    repo: https://github.com/gabdzo/cloud_spider/tree/main/upgrades/example   # REPO
    docs: https://github.com/gabdzo/cloud_spider#readme                        # DOCS
    dashboard: https://eu-north-1.console.aws.amazon.com/cloudwatch/home?region=eu-north-1   # DASHBOARD
  checks:                           # optional; run by the Cloud Spider server, cached ~60s
    http:
      - url: https://example.com/   # required per check, http(s)
        name: home page             # optional label
        expect: 200                 # optional, default 200 (100-599)
        contains: Example Domain    # optional text the body must contain
        timeout: 5000               # optional ms, default 5000 (100-30000); over half of it,
                                    # or over 2s, is "slow" (amber)
  slos:                             # optional; targets measured from data Cloud Spider already reads
    - name: home-availability       # required: lowercase, digits, dashes; unique in this vault
      sli: availability             # required: availability | latency | error-rate
      source: check:home page       # required: checks | check:<name> | alb | lambda | ec2 | resources
                                    #   | kube:api | kube:nodes | kube:restarts[:<ns>/<workload>]
      target: 99.5%                 # required: 50-99.999 (%), the SLO
      window: 30d                   # optional, default 30d (hours or days, up to 90d)
    - name: home-latency
      sli: latency
      source: check:home page
      threshold: 800                # latency only: good when at or under this many ms
      target: 99%
